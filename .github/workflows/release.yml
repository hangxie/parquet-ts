name: Release Build
permissions:
  contents: read

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=v$(jq -r '.version' package.json)
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

  npm-publish:
    runs-on: ubuntu-latest
    needs: check-version
    permissions:
      contents: read
      # Required for trusted publishing; npm exchanges this for a short-lived
      # credential, so there is no NPM_TOKEN to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles 10.x.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Running quality gates
        run: make all
      - name: Checking uncommitted changes
        run: |
          git status -s > /tmp/git-status.log
          if [ -s /tmp/git-status.log ] ; then
            echo There are uncommitted changes
            cat /tmp/git-status.log
            false
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public

  # Runs only once the package is on the registry, so a failed publish cannot
  # leave an announced release with nothing behind it.
  github-release:
    runs-on: ubuntu-latest
    needs: npm-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Push to github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
